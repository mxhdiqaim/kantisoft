services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kantisoft-api-dev
    ports:
      - "${PORT}:${PORT}"
    environment:
      NODE_ENV: development

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    mem_limit: 1g
    cpus: '0.5'
    depends_on:
      - postgres_db
    volumes:
      - .:/usr/src/app
  #    command: pnpm run dev

  postgres_db:
    image: postgres:16-alpine
    container_name: kantisoft-db-dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    mem_limit: 512m
    cpus: '0.5'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
